# 📁 config/services.yaml
# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    videos_directory:          '%kernel.project_dir%/public/uploads/videos'
    playlist_images_directory: '%kernel.project_dir%/public/uploads/playlists'
    groq_api_key:              '%env(GROQ_API_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Services généraux
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # 🔴 OBLIGATOIRE : déclarer les controllers comme services Symfony
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # ✅ Injection de la clé Groq dans SubtitleController
    App\Controller\SubtitleController:
        arguments:
            $groqApiKey: '%groq_api_key%'
