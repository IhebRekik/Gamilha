# config/services.yaml

parameters:
    apivideo.api_key: '%env(APIVIDEO_API_KEY)%'
    ably.api_key: '%env(ABLY_API_KEY)%'
    ai.api_key: '%env(AI_API_KEY)%'
    ai.api_url: '%env(AI_API_URL)%'
    

services:
    # Configuration globale par défaut (très bien)
    _defaults:
        autowire: true          # injection automatique des dépendances
        autoconfigure: true     # tags automatiques pour les services

    # Contrôleurs (parfait comme ça)
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # Tous les services de src/ sauf les dossiers exclus (très bien)
    App\:
        resource: '../src/'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # Service ApiVideoService : plus besoin de définition explicite !
    # Symfony autowire déjà correctement grâce à #[Autowire] dans le constructeur
    # → tu peux SUPPRIMER complètement cette partie si tu utilises #[Autowire]
    # App\Service\ApiVideoService:
    #     arguments:
    #         $apiKey: '%apivideo.api_key%'